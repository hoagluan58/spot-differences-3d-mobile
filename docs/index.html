<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Spot Differences 3D — Play Now</title>
  <meta name="description" content="Find the differences in stunning 3D scenes! Play Spot Differences 3D directly in your browser." />
  <meta name="theme-color" content="#0f1a2e" />

  <!-- Open Graph -->
  <meta property="og:title" content="Spot Differences 3D — Play Now" />
  <meta property="og:description" content="Find the differences in stunning 3D scenes! Play directly in your browser." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0f1a;
      --surface:   #141c2e;
      --accent:    #5aadff;
      --accent2:   #ff6b8a;
      --text:      #e8f0ff;
      --muted:     #6b7fa0;
      --radius:    16px;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    /* ── Game container ─────────────────────────────── */
    #game-wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }

    #unity-canvas {
      /* Portrait: cap to viewport height, respect 9:16 ratio */
      width:  min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      display: block;
      touch-action: none;
    }

    /* Loading overlay */
    #loading-overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
      background: var(--bg);
      z-index: 100;
      transition: opacity 0.5s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-title {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .loading-bar-track {
      width: 240px; height: 6px;
      background: var(--surface);
      border-radius: 100px;
      overflow: hidden;
    }
    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 100px;
      transition: width 0.3s ease;
    }
    .loading-percent {
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* Error overlay */
    #error-overlay {
      display: none;
      position: fixed; inset: 0;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      background: rgba(11,15,26,0.95);
      z-index: 200;
    }
    #error-overlay.visible { display: flex; }
    #error-overlay h2 { color: #f87171; font-size: 1.4rem; }
    #error-overlay p  { color: var(--muted); text-align: center; max-width: 320px; font-size: 0.9rem; line-height: 1.6; }
    .retry-btn {
      margin-top: 8px;
      padding: 12px 28px;
      border: none; border-radius: 100px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-family: inherit; font-size: 1rem; font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .retry-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(90,173,255,0.4); }
    .retry-btn:active { transform: translateY(0); }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading-overlay">
  <div class="loading-title">Spot Differences 3D</div>
  <div class="loading-bar-track">
    <div class="loading-bar-fill" id="loading-fill"></div>
  </div>
  <div class="loading-percent" id="loading-percent">Loading… 0%</div>
</div>

<!-- Error overlay -->
<div id="error-overlay">
  <h2>⚠️ Failed to Load</h2>
  <p>Something went wrong loading the game. Please check your connection and try again.</p>
  <button class="retry-btn" onclick="location.reload()">Retry</button>
</div>

<!-- Unity canvas -->
<div id="game-wrap">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>

<script>
  var buildUrl  = "Build";
  var loaderUrl = buildUrl + "/LocalWebGLBuild.loader.js";
  var config = {
    dataUrl:            buildUrl + "/LocalWebGLBuild.data.unityweb",
    frameworkUrl:       buildUrl + "/LocalWebGLBuild.framework.js.unityweb",
    codeUrl:            buildUrl + "/LocalWebGLBuild.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName:        "unity",
    productName:        "diff-quest-3d",
    productVersion:     "0.1.0",
  };

  var canvas         = document.getElementById("unity-canvas");
  var errorOverlay   = document.getElementById("error-overlay");
  var loadingOverlay = document.getElementById("loading-overlay");
  var loadingFill    = document.getElementById("loading-fill");
  var loadingPercent = document.getElementById("loading-percent");

  var script = document.createElement("script");
  script.src  = loaderUrl;
  script.onerror = function() {
    loadingOverlay.classList.add("hidden");
    errorOverlay.classList.add("visible");
  };
  script.onload = function() {
    createUnityInstance(canvas, config, function(progress) {
      var pct = Math.round(progress * 100);
      loadingFill.style.width = pct + "%";
      loadingPercent.textContent = "Loading… " + pct + "%";
    }).then(function(instance) {
      loadingOverlay.classList.add("hidden");
    }).catch(function(message) {
      console.error("Unity load error:", message);
      loadingOverlay.classList.add("hidden");
      errorOverlay.classList.add("visible");
    });
  };
  document.body.appendChild(script);
</script>
</body>
</html>
